name: windows

on:
  workflow_call:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep this separate from the caller's concurrency group.
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-2022
    if: github.repository == 'MetaHookSv/MetaHookSv'
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure CMake
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A Win32 `
            "-DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install/output" `
            -DMETAHOOKSV_INIT_SUBMODULES=OFF -DMETAHOOKSV_BUILD_AVX2=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Release
        run: |
          cmake --build build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install CMake output
        run: |
          cmake --install build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test installer payload operations
        run: |
          dotnet run --project toolsrc/MetahookInstaller/tests/MetahookInstaller.FileTests -c Release -- --payload "${{ github.workspace }}/install/output"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test release scripts
        run: |
          python -B -m unittest discover -s scripts/tests -p 'test_release*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Named separately so the read-only Git invariant is visible in CI on its
      # own, independently of the suite discovery pattern above.
      - name: Test read-only Git repository invariants
        run: |
          python -B -m unittest discover -s scripts/tests -p 'test_release_git.py' `
            -k test_repository_content_comparison_survives_storage_compaction -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish MetahookInstaller
        run: |
          dotnet publish toolsrc/MetahookInstaller/src/MetahookInstallerAvalonia.Desktop/MetahookInstallerAvalonia.Desktop.csproj `
            -p:PublishProfile=FolderProfile `
            -o build/installer-publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem -LiteralPath build/installer-publish -Filter '*.pdb' -Recurse | Remove-Item -Force

      - name: Publish MetahookInstallerCLI
        run: |
          dotnet publish toolsrc/MetahookInstaller/src/MetahookInstallerCLI/MetahookInstallerCLI.csproj `
            -c Release -r win-x64 `
            -o build/installer-cli-publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Native AOT discards PDBs; they are never part of the release payload.
          Get-ChildItem -LiteralPath build/installer-cli-publish -Filter '*.pdb' -Recurse | Remove-Item -Force

      - name: Package and verify release
        id: package
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = (Resolve-Path '.').Path
          $publishDirectory = Join-Path $workspace 'build/installer-publish'
          $installerName = 'MetahookInstallerAvalonia.Desktop.exe'
          $installerFiles = @(Get-ChildItem -LiteralPath $publishDirectory -Recurse -File -Filter $installerName)
          if ($installerFiles.Count -ne 1) {
            throw "Installer publish must contain exactly one $installerName."
          }
          # Native AOT cannot fold Avalonia's native backends into the executable,
          # so the GUI ships as the executable plus its native libraries. The set
          # is exact: any other file means an unintended payload crept in.
          $expectedNativeDlls = @('av_libglesv2.dll', 'libSkiaSharp.dll', 'libHarfBuzzSharp.dll')
          $publishedFiles = @(Get-ChildItem -LiteralPath $publishDirectory -Recurse -File)
          $unexpectedFiles = @($publishedFiles |
            Where-Object { $_.Name -ne $installerName -and $expectedNativeDlls -notcontains $_.Name })
          if ($unexpectedFiles.Count -gt 0) {
            throw "Installer publish contains unexpected files: $($unexpectedFiles.Name -join ', ')"
          }
          foreach ($nativeDll in $expectedNativeDlls) {
            if (!(Test-Path -LiteralPath (Join-Path $publishDirectory $nativeDll) -PathType Leaf)) {
              throw "Installer publish is missing its native backend library: $nativeDll"
            }
          }
          $cliPublishDirectory = Join-Path $workspace 'build/installer-cli-publish'
          $cliFiles = @(Get-ChildItem -LiteralPath $cliPublishDirectory -Recurse -File)
          if ($cliFiles.Count -ne 1 -or $cliFiles[0].Name -ne 'MetahookInstallerCLI.exe') {
            throw 'Installer CLI publish must contain exactly one self-contained executable.'
          }
          $payloadDirectory = Join-Path $workspace 'install/output'
          foreach ($name in @('MetaHook.exe', 'MetaHook_blob.exe')) {
            if (!(Test-Path -LiteralPath (Join-Path $payloadDirectory $name) -PathType Leaf)) {
              throw "Missing installed launcher: $name"
            }
          }
          # The AVX2 variants are probed ahead of the baseline plugin names, so a
          # release must ship them; a stale user copy would otherwise be loaded.
          foreach ($variant in @('BulletPhysics_AVX2.dll', 'Renderer_AVX2.dll')) {
            if (!(Test-Path -LiteralPath (Join-Path $payloadDirectory "svencoop/metahook/plugins/$variant") -PathType Leaf)) {
              throw "Missing installed AVX2 plugin variant: $variant"
            }
          }
          $staging = Join-Path $workspace 'build/package'
          $extracted = Join-Path $workspace 'build/package-verification'
          $debugStaging = Join-Path $workspace 'build/package-debug-info'
          $debugExtracted = Join-Path $workspace 'build/package-debug-info-verification'
          $archive = Join-Path $workspace 'build/artifacts/MetaHookSv-windows-x86.7z'
          $debugArchive = Join-Path $workspace 'build/artifacts/MetaHookSv-windows-x86-debug-info.7z'
          $fresh = @($staging, $extracted, $debugStaging, $debugExtracted, $archive, $debugArchive)
          if ($fresh | Where-Object { Test-Path -LiteralPath $_ }) {
            throw 'Packaging requires fresh staging, extraction and archive paths.'
          }
          New-Item -ItemType Directory -Path (Join-Path $staging 'install'), (Split-Path $archive), $extracted, $debugStaging, $debugExtracted -Force | Out-Null
          Copy-Item -LiteralPath $publishedFiles.FullName -Destination $staging
          Move-Item -LiteralPath (Join-Path $staging $installerName) -Destination (Join-Path $staging 'MetahookInstaller.exe') -Force
          Copy-Item -LiteralPath $cliFiles[0].FullName -Destination (Join-Path $staging 'MetahookInstallerCLI.exe')
          # Main archive never ships PDBs; the debug-info archive carries each
          # PDB next to its PE body in the same install-relative layout.
          Copy-Item -LiteralPath $payloadDirectory -Destination (Join-Path $staging 'install/output') -Recurse
          $stagedPdbs = @(Get-ChildItem -LiteralPath $staging -Recurse -File -Filter '*.pdb' -ErrorAction SilentlyContinue)
          if ($stagedPdbs.Count -gt 0) { $stagedPdbs | Remove-Item -Force }
          foreach ($pdb in @(Get-ChildItem -LiteralPath $payloadDirectory -Recurse -File -Filter '*.pdb')) {
            $relative = [System.IO.Path]::GetRelativePath($payloadDirectory, $pdb.FullName)
            $destination = Join-Path (Join-Path $debugStaging 'install/output') $relative
            New-Item -ItemType Directory -Path (Split-Path $destination) -Force | Out-Null
            Copy-Item -LiteralPath $pdb.FullName -Destination $destination
            $peer = [System.IO.Path]::ChangeExtension($pdb.FullName, $null).TrimEnd('.')
            $peerFile = @("$peer.dll", "$peer.exe") | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
            if (-not $peerFile) { throw "PDB has no matching PE to pair: $relative" }
            Copy-Item -LiteralPath $peerFile -Destination (Join-Path (Split-Path $destination) (Split-Path $peerFile -Leaf))
          }
          Push-Location $staging
          try {
            # The installer and its native backend libraries are named explicitly;
            # 'install/output' is recursive. Nothing else may reach the staging root.
            & 7z a -t7z $archive 'MetahookInstaller.exe' 'MetahookInstallerCLI.exe' $expectedNativeDlls 'install/output' -r
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
          Push-Location $debugStaging
          try {
            & 7z a -t7z $debugArchive 'install/output' -r
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
          function Test-Archive($archivePath, $directoryPath, $extractionPath) {
            & 7z t $archivePath
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & 7z x $archivePath "-o$extractionPath" -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $expectedFiles = @(Get-ChildItem -LiteralPath $directoryPath -Recurse -File)
            $actualFiles = @(Get-ChildItem -LiteralPath $extractionPath -Recurse -File)
            if ($expectedFiles.Count -ne $actualFiles.Count) { throw "Archive file count differs from staging: $archivePath" }
            foreach ($file in $expectedFiles) {
              $relative = [System.IO.Path]::GetRelativePath($directoryPath, $file.FullName)
              $actual = Join-Path $extractionPath $relative
              if (!(Test-Path -LiteralPath $actual -PathType Leaf) -or
                  (Get-FileHash -LiteralPath $file.FullName).Hash -ne (Get-FileHash -LiteralPath $actual).Hash) {
                throw "Archive content differs: $relative"
              }
            }
            if ((Get-Item -LiteralPath $archivePath).Length -eq 0) { throw "Release archive is empty: $archivePath" }
          }
          Test-Archive $archive $staging $extracted
          Test-Archive $debugArchive $debugStaging $debugExtracted
          $mainPdbs = @(Get-ChildItem -LiteralPath $extracted -Recurse -File -Filter '*.pdb' -ErrorAction SilentlyContinue)
          if ($mainPdbs.Count -gt 0) { throw 'Main archive must not contain PDB files.' }
          if (@(Get-ChildItem -LiteralPath $debugExtracted -Recurse -File -Filter '*.pdb').Count -eq 0) {
            throw 'Debug-info archive must contain PDB files.'
          }
          "archive-path=$archive" >> $env:GITHUB_OUTPUT
          "debug-archive-path=$debugArchive" >> $env:GITHUB_OUTPUT

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            ${{ steps.package.outputs.archive-path }}
            ${{ steps.package.outputs.debug-archive-path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: true
