name: clang-format

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clang-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Initialize formatting source repositories only
        run: |
          git submodule update --init -- \
            thirdparty/FormatValidation \
            MetaHook \
            Plugins/BetterSpray \
            Plugins/BulletPhysics \
            Plugins/CaptionMod \
            Plugins/HeapPatch \
            Plugins/InterpFix \
            Plugins/PrecacheManager \
            Plugins/Renderer \
            Plugins/ResourceReplacer \
            Plugins/SCCameraFix \
            Plugins/SCModelDownloader \
            Plugins/SteamScreenshots \
            Plugins/StudioEvents \
            Plugins/ThreadGuard \
            Plugins/VGUI2Extension \
            PluginLibs/SteamAPIBridge \
            PluginLibs/UtilAssetsIntegrity \
            PluginLibs/UtilHTTPClient_SteamAPI \
            PluginLibs/UtilHTTPClient_libcurl \
            PluginLibs/UtilThreadTask
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned formatter
        run: python -m pip install clang-format==23.1.3
      - name: Configure formatting targets
        run: cmake -S . -B build/format -DFORMAT_VALIDATION_ONLY=ON
      - name: Check all owned C/C++ sources
        run: cmake --build build/format --target format-check
